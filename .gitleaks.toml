# Two reviewed non-secret source-file SHA-256 fingerprints only.
# Keep the path AND exact-value condition; new hashes require fresh file checks.
[extend]
useDefault = true

[[allowlists]]
description = "Verified source-file content fingerprints, not service credentials"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)scripts_tools/v3/candidates/yard_connector_layout/(?:input_contract\.json|exports/20261020_062538_edcbfd/geometry\.json)$''']
regexes = ['''^(?:5bbde642e5d291718dbc0adddf3dd43cb001f05be3d904521f31f78efe16cf18|ad357fc68c68692a99f2d5394f8774569e3fa3caceaade0920a917468104b556)$''']

